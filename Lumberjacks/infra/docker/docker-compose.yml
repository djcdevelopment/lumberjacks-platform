services:
  postgres:
    image: postgres:16-alpine
    container_name: game-postgres
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    ports:
      - "${PGPORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-init-only. `pgdata` is a persistent named volume, so this hook fires once in the
      # volume's whole lifetime and is silently skipped on every later `up`. Any schema change
      # after that reaches this database only through `dbschema` below.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies the idempotent schema on every `up` and gates the .NET services behind it, so a
  # stale `pgdata` volume surfaces as a failed start rather than as `relation ... does not
  # exist` at runtime. See infra/gcp/p7/RUNBOOK-schema-repair.md for the incident that made this
  # necessary. No `restart:` policy - a one-shot must be allowed to exit.
  #
  # Intentionally shaped differently from P7, which profiles this service out of the default set
  # and runs it from an ExecStartPre. That is not a nicety there: P7 starts with
  # `docker compose up --wait`, and --wait counts a successfully exited container as a failure.
  # Nothing here uses --wait, so a plain `docker compose up` can carry the gate directly - which
  # is the stronger guarantee, and the one a developer actually wants. Do NOT add --wait to a
  # local `up` without also profiling this service out.
  dbschema:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: game
    volumes:
      - ./init.sql:/schema.sql:ro
    command: >-
      psql --host=postgres --username=game --dbname=game
           --no-password --set=ON_ERROR_STOP=1 --file=/schema.sql
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ../..
      target: gateway
    ports:
      - "4000:4000"
      - "4005:4005/udp"
    environment:
      Urls: "http://+:4000"
      ConnectionStrings__GameDb: "Host=postgres;Database=game;Username=game;Password=game"
      ServiceUrls__EventLog: "http://eventlog:4002"
      ServiceUrls__Progression: "http://progression:4003"
      # The local development lane composes both physical Valheim clients. The retired
      # one-seat alpha gate is a P7 rollout control, not a local capacity policy.
      LUMBERJACKS_ALPHA_SEAT_GATE: "${LUMBERJACKS_ALPHA_SEAT_GATE:-disabled}"
      LUMBERJACKS_AUTHORITATIVE_WINDOW_ID: "${LUMBERJACKS_AUTHORITATIVE_WINDOW_ID:-am4-handshake-async-20260730}"
    depends_on:
      postgres:
        condition: service_healthy
      dbschema:
        condition: service_completed_successfully

  eventlog:
    build:
      context: ../..
      target: eventlog
    ports:
      - "4002:4002"
    environment:
      Urls: "http://+:4002"
      ConnectionStrings__GameDb: "Host=postgres;Database=game;Username=game;Password=game"
    depends_on:
      postgres:
        condition: service_healthy
      dbschema:
        condition: service_completed_successfully

  progression:
    build:
      context: ../..
      target: progression
    ports:
      - "4003:4003"
    environment:
      Urls: "http://+:4003"
      ConnectionStrings__GameDb: "Host=postgres;Database=game;Username=game;Password=game"
    depends_on:
      postgres:
        condition: service_healthy
      dbschema:
        condition: service_completed_successfully

  operatorapi:
    build:
      context: ../..
      target: operatorapi
    ports:
      - "4004:4004"
    environment:
      Urls: "http://+:4004"
      ConnectionStrings__GameDb: "Host=postgres;Database=game;Username=game;Password=game"
      ServiceUrls__Gateway: "http://gateway:4000"
      ServiceUrls__EventLog: "http://eventlog:4002"
      ServiceUrls__Progression: "http://progression:4003"
    depends_on:
      postgres:
        condition: service_healthy
      dbschema:
        condition: service_completed_successfully

volumes:
  pgdata:
