events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # The SSH/IAP tunnel, not the public port.
  #
  # This used to point at 8.231.129.249:42317, the VM's public player endpoint. That
  # capped what this proxy could ever show: admin and dev surfaces are bound to the VM's
  # loopback on purpose and are not published on :42317 at all, so no allowlist change
  # here could have reached them. The only way to serve them over the public port would
  # have been to publish them, which is exactly the isolation infra/gcp/p7/docker-compose.yml
  # exists to preserve.
  #
  # So this follows the tunnel that infra/gcp/p7/scripts/start-gateway-tunnel.ps1 already
  # opens - local 14000 -> VM 127.0.0.1:4000, over SSH through IAP. Start it first:
  #
  #   & infra\gcp\p7\scripts\gateway-tunnel.ps1 -Action start
  #
  # Widening the allowlist below therefore does NOT widen exposure. This proxy still binds
  # 127.0.0.1 only, the tunnel is authenticated by the operator's own IAM identity, and the
  # VM publishes nothing it did not publish before.
  upstream gcp_lumberjacks {
    server host.docker.internal:14000;
  }

  server {
    listen 8080;
    server_name localhost;

    location = / {
      return 302 /community;
    }

    location = /health {
      proxy_pass http://gcp_lumberjacks;
    }

    # ---- HTML surfaces -------------------------------------------------------

    location = /community {
      proxy_pass http://gcp_lumberjacks;
    }

    location = /roadmap {
      root /usr/share/nginx/html;
      try_files /roadmap.html =404;
    }

    location = /networksense {
      proxy_pass http://gcp_lumberjacks;
    }

    location = /events {
      proxy_pass http://gcp_lumberjacks;
    }

    location = /testing {
      proxy_pass http://gcp_lumberjacks;
    }

    # ---- Read-only telemetry and stats ---------------------------------------
    #
    # Every one of these is GET-only. The point of this proxy is reading state, and each
    # of these prefixes also contains mutating routes that must NOT come along: the
    # zdo-redirect group holds /reset and /compact, and zdo-injection holds /stage and
    # /reset. `limit_except GET` is what keeps a prefix match from dragging those in.

    # Public v0 schema: /valheim, /cutover, /deployment.
    location /api/v0/telemetry/ {
      limit_except GET { deny all; }
      proxy_pass http://gcp_lumberjacks;
    }

    # Transport counters and live session aggregates.
    location /live/ {
      limit_except GET { deny all; }
      proxy_pass http://gcp_lumberjacks;
    }

    # Authoritative queue depth, receipts, acks - overall and per window.
    location /valheim/zdo-redirect/status {
      limit_except GET { deny all; }
      proxy_pass http://gcp_lumberjacks;
    }

    # Per-window consumer state.
    location /api/v0/valheim/zdo-consumers/ {
      limit_except GET { deny all; }
      proxy_pass http://gcp_lumberjacks;
    }

    # Injection queue state.
    location /valheim/zdo-injection/status {
      limit_except GET { deny all; }
      proxy_pass http://gcp_lumberjacks;
    }

    # Deliberately NOT forwarded, though the tunnel could now reach them:
    #   /api/v0/enrollment      - lists SteamIDs; a roster, not a statistic.
    #   /valheim/handshake/*    - admission control, not observation.
    #   /join/*                 - the volunteer credential flow.
    #   everything POST         - this is a viewing surface.
    location / {
      return 404;
    }
  }
}
