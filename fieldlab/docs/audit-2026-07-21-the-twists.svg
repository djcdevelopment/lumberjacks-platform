<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1810" width="1440" height="1810" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#484f58"/>
    </marker>
  </defs>

  <rect width="1440" height="1810" fill="#0d1117"/>

  <!-- HEADER -->
  <text x="50" y="60" fill="#e6edf3" font-size="34" font-weight="700">Sixteen times the answer changed when we looked</text>
  <text x="50" y="90" fill="#8b949e" font-size="15">baseline · the 2026-07-21 audit and its follow-through · every claim below was confident, and wrong, until it was checked</text>
  <line x1="50" y1="112" x2="1390" y2="112" stroke="#30363d"/>

  <rect x="50" y="132" width="1340" height="76" rx="8" fill="url(#hdr)" stroke="#30363d"/>
  <text x="74" y="162" fill="#e6edf3" font-size="14" font-weight="600">The pattern, stated once:</text>
  <text x="74" y="186" fill="#8b949e" font-size="13">Every wrong claim was <tspan fill="#ffa94d" font-style="italic">locally valid</tspan>. Each followed soundly from a boundary drawn too small — one repo, one file, one packed context, one thread's view.</text>
  <text x="1030" y="162" fill="#6e7681" font-size="12">caught by · me 6 · a model 4</text>
  <text x="1030" y="184" fill="#6e7681" font-size="12">Derek 3 · a tool 3</text>

  <!-- SPINE -->
  <line x1="700" y1="238" x2="700" y2="1592" stroke="#30363d" stroke-width="2"/>

  <!-- ============ TWISTS ============ -->
  <!-- 1 L -->
  <g><rect x="70" y="240" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="70" y="240" width="3" height="72" rx="1.5" fill="#ffa94d"/>
  <text x="86" y="262" fill="#6e7681" font-size="12" font-style="italic">“The dashboard IP is stale after the re-provision.”</text>
  <text x="86" y="284" fill="#e6edf3" font-size="13">It is a <tspan font-weight="600">reserved static</tspan>, and it answers TCP right now.</text>
  <text x="86" y="303" fill="#484f58" font-size="11">my own hunch, stated before checking</text></g>
  <line x1="650" y1="276" x2="690" y2="276" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="276" r="13" fill="#0d1117" stroke="#ffa94d" stroke-width="2"/><text x="700" y="281" fill="#ffa94d" font-size="12" font-weight="700" text-anchor="middle">1</text>

  <!-- 2 R -->
  <g><rect x="750" y="324" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="750" y="324" width="3" height="72" rx="1.5" fill="#74c0fc"/>
  <text x="766" y="346" fill="#6e7681" font-size="12" font-style="italic">“The release-cut scripts hold stale split-repo paths.”</text>
  <text x="766" y="368" fill="#e6edf3" font-size="13">They resolve correctly. The model matched the variable <tspan font-family="ui-monospace, monospace" fill="#74c0fc">$ComfyRoot</tspan> by <tspan font-weight="600">name</tspan>.</text>
  <text x="766" y="387" fill="#484f58" font-size="11">gemini-pro, conditional-logic sweep</text></g>
  <line x1="750" y1="360" x2="710" y2="360" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="360" r="13" fill="#0d1117" stroke="#74c0fc" stroke-width="2"/><text x="700" y="365" fill="#74c0fc" font-size="12" font-weight="700" text-anchor="middle">2</text>

  <!-- 3 L -->
  <g><rect x="70" y="408" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="70" y="408" width="3" height="72" rx="1.5" fill="#74c0fc"/>
  <text x="86" y="430" fill="#6e7681" font-size="12" font-style="italic">“ActiveSeconds is a live time-bomb — drops the serving path at 90s.”</text>
  <text x="86" y="452" fill="#e6edf3" font-size="13"><tspan font-weight="600">0 means no cap</tspan>, and the P7 runbook pins it to 0.</text>
  <text x="86" y="471" fill="#484f58" font-size="11">m5 passing 148,892 ZDOs is what made it worth checking</text></g>
  <line x1="650" y1="444" x2="690" y2="444" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="444" r="13" fill="#0d1117" stroke="#74c0fc" stroke-width="2"/><text x="700" y="449" fill="#74c0fc" font-size="12" font-weight="700" text-anchor="middle">3</text>

  <!-- 4 R -->
  <g><rect x="750" y="492" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="750" y="492" width="3" height="72" rx="1.5" fill="#74c0fc"/>
  <text x="766" y="514" fill="#6e7681" font-size="12" font-style="italic">“The priority system is purely advisory.”</text>
  <text x="766" y="536" fill="#e6edf3" font-size="13">Half right. The <tspan font-weight="600">rank is enforced</tspan> at <tspan font-family="ui-monospace, monospace" fill="#74c0fc">ZdoRedirectRunner.cs:337</tspan>.</text>
  <text x="766" y="555" fill="#484f58" font-size="11">the plan is advisory; the rank is not — different things</text></g>
  <line x1="750" y1="528" x2="710" y2="528" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="528" r="13" fill="#0d1117" stroke="#74c0fc" stroke-width="2"/><text x="700" y="533" fill="#74c0fc" font-size="12" font-weight="700" text-anchor="middle">4</text>

  <!-- 5 L -->
  <g><rect x="70" y="576" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="70" y="576" width="3" height="72" rx="1.5" fill="#74c0fc"/>
  <text x="86" y="598" fill="#6e7681" font-size="12" font-style="italic">“Three files are entirely missing from the repo.”</text>
  <text x="86" y="620" fill="#e6edf3" font-size="13">All three exist. They were not in <tspan font-style="italic">that thread's</tspan> packed set.</text>
  <text x="86" y="639" fill="#484f58" font-size="11">absence from a context window is not absence from the repo</text></g>
  <line x1="650" y1="612" x2="690" y2="612" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="612" r="13" fill="#0d1117" stroke="#74c0fc" stroke-width="2"/><text x="700" y="617" fill="#74c0fc" font-size="12" font-weight="700" text-anchor="middle">5</text>

  <!-- 6 R  DEREK -->
  <g><rect x="750" y="660" width="580" height="72" rx="6" fill="#161b22" stroke="#2ea043"/><rect x="750" y="660" width="3" height="72" rx="1.5" fill="#51cf66"/>
  <text x="766" y="682" fill="#6e7681" font-size="12" font-style="italic">“The AoI density dataset is GONE — never tracked, unrecoverable.”</text>
  <text x="766" y="704" fill="#e6edf3" font-size="13">All three artifacts sat in <tspan font-family="ui-monospace, monospace" fill="#51cf66">C:\work\comfy</tspan>. 9,600 modelled rows.</text>
  <text x="766" y="723" fill="#51cf66" font-size="11">Derek: “anything we lost exists in repos we cloned to make this one”</text></g>
  <line x1="750" y1="696" x2="710" y2="696" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="696" r="13" fill="#0d1117" stroke="#51cf66" stroke-width="2"/><text x="700" y="701" fill="#51cf66" font-size="12" font-weight="700" text-anchor="middle">6</text>

  <!-- 7 L -->
  <g><rect x="70" y="744" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="70" y="744" width="3" height="72" rx="1.5" fill="#ffa94d"/>
  <text x="86" y="766" fill="#6e7681" font-size="12" font-style="italic">“1,000 result rows — so the campaign collected data.”</text>
  <text x="86" y="788" fill="#e6edf3" font-size="13">998 synthetic. <tspan font-weight="600">One</tspan> real — and its rtt, bytes and packets were all <tspan font-weight="600">0</tspan>.</text>
  <text x="86" y="807" fill="#484f58" font-size="11">the client sat in Solo and never connected: zero networked measurements</text></g>
  <line x1="650" y1="780" x2="690" y2="780" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="780" r="13" fill="#0d1117" stroke="#ffa94d" stroke-width="2"/><text x="700" y="785" fill="#ffa94d" font-size="12" font-weight="700" text-anchor="middle">7</text>

  <!-- 8 R -->
  <g><rect x="750" y="828" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="750" y="828" width="3" height="72" rx="1.5" fill="#ffa94d"/>
  <text x="766" y="850" fill="#6e7681" font-size="12" font-style="italic">“Those sim rows still work as a load proxy.”</text>
  <text x="766" y="872" fill="#e6edf3" font-size="13">0.2% variance from empty control to extreme. <tspan font-family="ui-monospace, monospace">avg_fps</tspan> constant at 60.0.</text>
  <text x="766" y="891" fill="#484f58" font-size="11">the principle was sound; these particular rows are flat</text></g>
  <line x1="750" y1="864" x2="710" y2="864" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="864" r="13" fill="#0d1117" stroke="#ffa94d" stroke-width="2"/><text x="700" y="869" fill="#ffa94d" font-size="12" font-weight="700" text-anchor="middle">8</text>

  <!-- 9 L -->
  <g><rect x="70" y="912" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="70" y="912" width="3" height="72" rx="1.5" fill="#ffa94d"/>
  <text x="86" y="934" fill="#6e7681" font-size="12" font-style="italic">“A tuning campaign would be blind — there is no instrumentation.”</text>
  <text x="86" y="956" fill="#e6edf3" font-size="13"><tspan font-family="ui-monospace, monospace" fill="#ffa94d">TickMetrics</tspan> already had overruns, a per-phase histogram, sent-vs-culled.</text>
  <text x="86" y="975" fill="#484f58" font-size="11">true of InterestManager; false one layer up</text></g>
  <line x1="650" y1="948" x2="690" y2="948" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="948" r="13" fill="#0d1117" stroke="#ffa94d" stroke-width="2"/><text x="700" y="953" fill="#ffa94d" font-size="12" font-weight="700" text-anchor="middle">9</text>

  <!-- 10 R DEREK -->
  <g><rect x="750" y="996" width="580" height="72" rx="6" fill="#161b22" stroke="#2ea043"/><rect x="750" y="996" width="3" height="72" rx="1.5" fill="#51cf66"/>
  <text x="766" y="1018" fill="#6e7681" font-size="12" font-style="italic">“Landmarks need a new parallel announcement channel.”</text>
  <text x="766" y="1040" fill="#e6edf3" font-size="13">The <tspan font-weight="600">dual-channel lane split</tspan> already did it. Reliable is region-wide by design.</text>
  <text x="766" y="1059" fill="#51cf66" font-size="11">Derek: “it's almost like there's a reason I built it dual channel”</text></g>
  <line x1="750" y1="1032" x2="710" y2="1032" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="1032" r="13" fill="#0d1117" stroke="#51cf66" stroke-width="2"/><text x="700" y="1037" fill="#51cf66" font-size="12" font-weight="700" text-anchor="middle">10</text>

  <!-- 11 L SELF -->
  <g><rect x="70" y="1080" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="70" y="1080" width="3" height="72" rx="1.5" fill="#ff6b6b"/>
  <text x="86" y="1102" fill="#6e7681" font-size="12" font-style="italic">“L-2026-07-21-9, byte-level I/O on Windows: <tspan font-weight="600">held</tspan>.”</text>
  <text x="86" y="1124" fill="#e6edf3" font-size="13">Broke it myself about <tspan font-weight="600">an hour later</tspan>, mojibaking a README.</text>
  <text x="86" y="1143" fill="#484f58" font-size="11">writing a lesson down is not a control</text></g>
  <line x1="650" y1="1116" x2="690" y2="1116" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="1116" r="13" fill="#0d1117" stroke="#ff6b6b" stroke-width="2"/><text x="700" y="1121" fill="#ff6b6b" font-size="12" font-weight="700" text-anchor="middle">11</text>

  <!-- 12 R -->
  <g><rect x="750" y="1164" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="750" y="1164" width="3" height="72" rx="1.5" fill="#ffa94d"/>
  <text x="766" y="1186" fill="#6e7681" font-size="12" font-style="italic">“D2: delete these 17 evidence-only keys.”</text>
  <text x="766" y="1208" fill="#e6edf3" font-size="13">All three groups load-bearing. <tspan font-weight="600">Projection is the landmark-proxy prototype.</tspan></text>
  <text x="766" y="1227" fill="#484f58" font-size="11">my own recommendation, invalidated by a design written hours later</text></g>
  <line x1="750" y1="1200" x2="710" y2="1200" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="1200" r="13" fill="#0d1117" stroke="#ffa94d" stroke-width="2"/><text x="700" y="1205" fill="#ffa94d" font-size="12" font-weight="700" text-anchor="middle">12</text>

  <!-- 13 L -->
  <g><rect x="70" y="1248" width="580" height="72" rx="6" fill="#161b22" stroke="#21262d"/><rect x="70" y="1248" width="3" height="72" rx="1.5" fill="#ffa94d"/>
  <text x="86" y="1270" fill="#6e7681" font-size="12" font-style="italic">“D3 is an independent, clean delete.”</text>
  <text x="86" y="1292" fill="#e6edf3" font-size="13">It is the <tspan font-weight="600">arming path</tspan> for D4's runners. Not independent at all.</text>
  <text x="86" y="1311" fill="#484f58" font-size="11">audit output describes files; it does not describe couplings</text></g>
  <line x1="650" y1="1284" x2="690" y2="1284" stroke="#484f58" marker-end="url(#ar)"/><circle cx="700" cy="1284" r="13" fill="#0d1117" stroke="#ffa94d" stroke-width="2"/><text x="700" y="1289" fill="#ffa94d" font-size="12" font-weight="700" text-anchor="middle">13</text>

  <!-- 14 R NEAR MISS -->
  <g><rect x="750" y="1332" width="580" height="72" rx="6" fill="#1a1216" stroke="#ff6b6b"/><rect x="750" y="1332" width="3" height="72" rx="1.5" fill="#ff6b6b"/>
  <text x="766" y="1354" fill="#6e7681" font-size="12" font-style="italic">“fieldlab/autonomous is dead swarm scaffolding.” <tspan fill="#ff6b6b">— deleted it</tspan></text>
  <text x="766" y="1376" fill="#e6edf3" font-size="13">It defines <tspan font-weight="600" fill="#ff6b6b">two containers running right now</tspan>. Restored.</text>
  <text x="766" y="1395" fill="#ff6b6b" font-size="11">caught by checking references after the delete, before the commit</text></g>
  <line x1="750" y1="1368" x2="710" y2="1368" stroke="#ff6b6b" marker-end="url(#ar)"/><circle cx="700" cy="1368" r="13" fill="#0d1117" stroke="#ff6b6b" stroke-width="2"/><text x="700" y="1373" fill="#ff6b6b" font-size="12" font-weight="700" text-anchor="middle">14</text>

  <!-- 15 L NEAR MISS -->
  <g><rect x="70" y="1416" width="580" height="72" rx="6" fill="#1a1216" stroke="#ff6b6b"/><rect x="70" y="1416" width="3" height="72" rx="1.5" fill="#ff6b6b"/>
  <text x="86" y="1438" fill="#6e7681" font-size="12" font-style="italic">“Cut the method starting from its comment.” <tspan fill="#ff6b6b">— nearly did</tspan></text>
  <text x="86" y="1460" fill="#e6edf3" font-size="13">The comment had drifted. <tspan font-weight="600" fill="#ff6b6b">Production redirect arming was inside.</tspan></text>
  <text x="86" y="1479" fill="#ff6b6b" font-size="11">caught by an assert-before-delete that aborted the cut</text></g>
  <line x1="650" y1="1452" x2="690" y2="1452" stroke="#ff6b6b" marker-end="url(#ar)"/><circle cx="700" cy="1452" r="13" fill="#0d1117" stroke="#ff6b6b" stroke-width="2"/><text x="700" y="1457" fill="#ff6b6b" font-size="12" font-weight="700" text-anchor="middle">15</text>

  <!-- 16 R NEAR MISS -->
  <g><rect x="750" y="1500" width="580" height="72" rx="6" fill="#1a1216" stroke="#ff6b6b"/><rect x="750" y="1500" width="3" height="72" rx="1.5" fill="#ff6b6b"/>
  <text x="766" y="1522" fill="#6e7681" font-size="12" font-style="italic">“Bounce the gateway to finish retiring matrix.”</text>
  <text x="766" y="1544" fill="#e6edf3" font-size="13">The live gateway runs from the <tspan font-weight="600" fill="#ff6b6b">retired repo</tspan>. Image built 2026-07-15.</text>
  <text x="766" y="1563" fill="#ff6b6b" font-size="11">the P7 problem again — for a local service nobody thought to check</text></g>
  <line x1="750" y1="1536" x2="710" y2="1536" stroke="#ff6b6b" marker-end="url(#ar)"/><circle cx="700" cy="1536" r="13" fill="#0d1117" stroke="#ff6b6b" stroke-width="2"/><text x="700" y="1541" fill="#ff6b6b" font-size="12" font-weight="700" text-anchor="middle">16</text>

  <!-- FOOTER -->
  <line x1="50" y1="1616" x2="1390" y2="1616" stroke="#30363d"/>

  <g font-size="11">
    <rect x="50" y="1640" width="3" height="14" rx="1.5" fill="#51cf66"/><text x="64" y="1651" fill="#8b949e">Derek caught it</text>
    <rect x="220" y="1640" width="3" height="14" rx="1.5" fill="#74c0fc"/><text x="234" y="1651" fill="#8b949e">a model claimed it</text>
    <rect x="410" y="1640" width="3" height="14" rx="1.5" fill="#ffa94d"/><text x="424" y="1651" fill="#8b949e">I claimed it</text>
    <rect x="560" y="1640" width="3" height="14" rx="1.5" fill="#ff6b6b"/><text x="574" y="1651" fill="#8b949e">near miss — would have broken something live</text>
  </g>

  <text x="50" y="1694" fill="#e6edf3" font-size="14" font-weight="600">What the shape says</text>
  <text x="50" y="1718" fill="#8b949e" font-size="12.5">Not one of these was a careless mistake. Each was a correct inference from an incomplete boundary — one repo, one file, one packed context,</text>
  <text x="50" y="1738" fill="#8b949e" font-size="12.5">one thread's view. The fix is never “be more careful”; it is <tspan fill="#e6edf3" font-weight="600">name the boundary you searched, then ask what sits outside it</tspan>.</text>
  <text x="50" y="1766" fill="#8b949e" font-size="12.5">Three of the last three would have broken something running. All three were caught by a check that cost seconds: <tspan font-family="ui-monospace, monospace" fill="#74c0fc">docker ps</tspan>, an</text>
  <text x="50" y="1786" fill="#8b949e" font-size="12.5">assertion before a delete, and a <tspan font-family="ui-monospace, monospace" fill="#74c0fc">git grep</tspan> after one. The audit's value was not the findings — it was refusing to trust them.</text>

  <text x="1390" y="1786" fill="#484f58" font-size="11" text-anchor="end">fieldlab/docs/audit-2026-07-21-the-twists.svg</text>
</svg>
