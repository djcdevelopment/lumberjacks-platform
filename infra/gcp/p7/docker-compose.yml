name: comfy-lumberjacks-p7

x-lumberjacks-telemetry: &lumberjacks-telemetry
  GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT must be set}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=gcp-p7,service.namespace=lumberjacks"
  LUMBERJACKS_VERSION: "${LUMBERJACKS_VERSION:?LUMBERJACKS_VERSION must be set}"
  OTEL_SERVICE_VERSION: "${LUMBERJACKS_VERSION:?LUMBERJACKS_VERSION must be set}"
  COMFY_NETWORKSENSE_VERSION: "${COMFY_NETWORKSENSE_VERSION:-unknown}"
  VALHEIM_TELEMETRY_KEY: "${VALHEIM_TELEMETRY_KEY:-}"
  LUMBERJACKS_CLIENT_ACCESS_KEY: "${LUMBERJACKS_CLIENT_ACCESS_KEY:-}"
  LUMBERJACKS_ENROLLMENT_PATH: "/var/lib/lumberjacks/enrollment/invites.json"
  LUMBERJACKS_ADMIN_KEY: "${LUMBERJACKS_ADMIN_KEY:-}"
  LUMBERJACKS_PLAYER_GATEWAY_URL: "${LUMBERJACKS_PLAYER_GATEWAY_URL:-http://127.0.0.1:14000}"
  LUMBERJACKS_ENROLLMENT_PUBLIC_URL: "${LUMBERJACKS_ENROLLMENT_PUBLIC_URL:-http://127.0.0.1:14000}"
  LUMBERJACKS_AUTHORITATIVE_WINDOW_ID: "${LUMBERJACKS_AUTHORITATIVE_WINDOW_ID:-p7-primary-v1}"

x-lumberjacks-service: &lumberjacks-service
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /mnt/comfy-p7/lumberjacks/postgres:/var/lib/postgresql/data
      # NOT the schema path. docker-entrypoint-initdb.d runs ONCE, on an empty PGDATA, and the
      # data directory above is a persistent bind mount on the state disk - it survives every
      # `compose down`, image re-pin and VM stop, so that window opens exactly once per disk.
      # It was missed on the 2026-07-24 state-disk replacement and the stack ran schema-less
      # for days while reporting healthy. The `dbschema` service below is the real schema path;
      # this mount only saves one redundant pass on a genuinely fresh volume. Path is relative
      # to THIS FILE (compose resolves it that way), not to LUMBERJACKS_ROOT: the 2026-07-20
      # unification moved init.sql under Lumberjacks/, so the old
      # `${LUMBERJACKS_ROOT}/infra/docker/init.sql` no longer names a file in a baseline
      # checkout - and a missing bind source is materialized by Docker as an empty DIRECTORY,
      # which is why nothing complained.
      - "../../../Lumberjacks/infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The schema gate. Applies the idempotent schema on EVERY start, so "tables missing" is a loud
  # failure instead of a warning buried in the Gateway log and a permanently empty dashboard
  # panel. Reuses the postgres image already pinned above: no extra pull, no build, so the fix
  # ships by git bundle plus a restart with no Gateway image promotion.
  #
  # PROFILED, and it must stay that way. `docker compose up --wait` - which
  # comfy-lumberjacks-p7.service now uses, and which is what makes `up` exit 0 mean "serving"
  # rather than "created" - counts a container that EXITED SUCCESSFULLY as a failure
  # ("container ... exited (0)", exit code 1). A one-shot left in the default service set fails
  # every ExecStart, and Restart=on-failure turns that into a 30-second boot loop. So the gate
  # cannot be expressed here as `depends_on: condition: service_completed_successfully` on the
  # four .NET services: compose auto-enables a dependency's profile and pulls it straight back
  # into the waited set. The ordering guarantee lives in the unit instead, as an ExecStartPre
  # that runs `docker compose run --rm dbschema` before the waited `up`.
  #
  # Consequence worth knowing before you type it: a bare `docker compose up -d` on the VM does
  # NOT apply the schema. Start through the unit, which is the single authoritative starter, or
  # run this service by hand first. `docker compose run --rm dbschema` auto-enables the profile.
  #
  # Deliberately does NOT inherit *lumberjacks-service: `restart: unless-stopped` would treat a
  # successful one-shot exit as a crash and restart it forever.
  dbschema:
    image: postgres:16-alpine
    profiles: ["schema"]
    restart: "no"
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - "../../../Lumberjacks/infra/docker/init.sql:/schema.sql:ro"
    command: >-
      psql --host=postgres --username=game --dbname=game
           --no-password --set=ON_ERROR_STOP=1 --file=/schema.sql
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *lumberjacks-service
    # M0 freeze: the gateway runs only promoted, prebuilt release images.
    # LUMBERJACKS_GATEWAY_IMAGE lives in /etc/comfy-p7/environment and is set
    # by the promotion flow (PROMOTION-DRILL.md). There is deliberately no
    # build: fallback on the VM; rollback is an image re-pin, never a rebuild.
    image: "${LUMBERJACKS_GATEWAY_IMAGE:?LUMBERJACKS_GATEWAY_IMAGE must be set to the promoted release image}"
    ports:
      - "127.0.0.1:4000:4000"
      - "${LUMBERJACKS_PLAYER_PORT:-42317}:4000"
      # Authenticated datagram lane. Remote clients receive a random session token over their
      # enrolled WebSocket before this socket accepts motion; the matching GCP rule intentionally
      # uses the same source ranges as the player gateway.
      - "${LUMBERJACKS_PLAYER_UDP_PORT:-4005}:4005/udp"
    environment:
      <<: *lumberjacks-telemetry
      OTEL_SERVICE_NAME: lumberjacks-gateway
      BoundaryEvents__Enabled: "${BOUNDARY_EVENTS_ENABLED:-true}"
      BoundaryEvents__Path: "/var/lib/lumberjacks/boundary-events"
      BoundaryEvents__SegmentBytes: "${BOUNDARY_EVENTS_SEGMENT_BYTES:-67108864}"
      BoundaryEvents__FlushIntervalMilliseconds: "${BOUNDARY_EVENTS_FLUSH_INTERVAL_MS:-1000}"
      BoundaryEvents__Release: "${LUMBERJACKS_VERSION:?LUMBERJACKS_VERSION must be set}"
      BoundaryEvents__Instance: "${HOSTNAME:-p7-gateway}"
      LUMBERJACKS_ROADMAP_HTML: "${LUMBERJACKS_ROADMAP_HTML:-/var/lib/lumberjacks/roadmap/roadmap.html}"
      # Preferred operator-facing switch for the temporary alpha reservation gate. `disabled` means
      # known testers are not artificially capped by Gateway before Valheim admits them; `one-seat`
      # restores the original conservative reservation. Blank means "use the numeric fallback below."
      LUMBERJACKS_ALPHA_SEAT_GATE: "${LUMBERJACKS_ALPHA_SEAT_GATE:-}"
      # Rollback compatibility for older Gateway images that do not understand
      # LUMBERJACKS_ALPHA_SEAT_GATE.
      ValheimHandshake__SeatCapacity: "${VALHEIM_HANDSHAKE_SEAT_CAPACITY:-1}"
      Urls: "http://+:4000"
      ConnectionStrings__GameDb: "Host=postgres;Database=game;Username=game;Password=${POSTGRES_PASSWORD}"
      ServiceUrls__EventLog: "http://eventlog:4002"
      ServiceUrls__Progression: "http://progression:4003"
      VALHEIM_ZDO_QUEUE_PATH: "/var/lib/lumberjacks/zdo-queue/redirect.wal"
      # The recipient cutover. /etc/comfy-p7/environment is read by the compose PROCESS, not the
      # container, so without this reference the env file alone reaches nothing and the flag looks
      # set while the Gateway never sees it. Defaults false: flipping it before the mod that stamps
      # recipients is deployed halts delivery silently.
      ValheimQueue__ProducerEmitsRecipients: "${VALHEIM_QUEUE_PRODUCER_EMITS_RECIPIENTS:-false}"
      # Self-service volunteer onboarding: the base mod-pack template the Gateway personalizes and
      # streams from POST /join/pack, and the Valheim connect address the status banner advertises.
      # The template is mounted read-only below and MUST be kept in sync with the shipped mod build.
      LUMBERJACKS_MODPACK_TEMPLATE: "${LUMBERJACKS_MODPACK_TEMPLATE:-/var/lib/lumberjacks/modpack/Comfy-P7-Alpha-Mods.zip}"
      # A current.json published beside the package overrides the legacy template identity at
      # request time. This is the client-pull release pointer: publishing a mod/config package no
      # longer means changing the Gateway image or restarting the Gateway container.
      LUMBERJACKS_MODPACK_MANIFEST: "${LUMBERJACKS_MODPACK_MANIFEST:-/var/lib/lumberjacks/modpack/current.json}"
      LUMBERJACKS_VALHEIM_CONNECT: "${LUMBERJACKS_VALHEIM_CONNECT:-8.231.129.249:2456}"
    volumes:
      - /mnt/comfy-p7/lumberjacks/zdo-queue:/var/lib/lumberjacks/zdo-queue
      - /mnt/comfy-p7/lumberjacks/enrollment:/var/lib/lumberjacks/enrollment
      - /mnt/comfy-p7/lumberjacks/boundary-events:/var/lib/lumberjacks/boundary-events
      - /mnt/comfy-p7/lumberjacks/modpack:/var/lib/lumberjacks/modpack:ro
      - /mnt/comfy-p7/lumberjacks/roadmap:/var/lib/lumberjacks/roadmap:ro
    depends_on:
      postgres:
        condition: service_healthy

  # TLS termination for the public volunteer endpoint (M1 gate). INERT BY DEFAULT: the `tls` profile
  # means this service does not exist for any plain `docker compose up` - it starts only under
  # COMPOSE_PROFILES=tls. A profile rather than an override file on purpose: M0 retired the
  # promotion override precisely because a second file that must be remembered is a footgun, and an
  # in-file switch that must be named cannot be forgotten into the default path.
  #
  # PREREQUISITES, none of which this file can satisfy on its own:
  #   1. LUMBERJACKS_PUBLIC_DNS_NAME - a real DNS A record pointing at this VM. ACME will not issue
  #      for a bare IP, so there is no TLS without a name. Operator decision, still open.
  #   2. LUMBERJACKS_ACME_EMAIL - where Let's Encrypt sends expiry warnings.
  #   3. Firewall: 80 and 443 open. 80 is not optional - HTTP-01 issuance needs it - and neither is
  #      in the current terraform, which opens only the player port.
  # Enabling the profile without these fails fast at startup rather than half-serving, which is the
  # behaviour we want from a switch that only ever gets thrown once.
  caddy:
    <<: *lumberjacks-service
    profiles: ["tls"]
    # Digest-pinned like valheim-server: a floating tag on a TLS terminator means the thing holding
    # your certificates can change under a drill without anyone choosing it.
    image: caddy@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    ports:
      # 80 carries the ACME HTTP-01 challenge and the redirect to 443, nothing else.
      # No udp/443: HTTP/3 is not opened in the firewall, and publishing a port nothing can reach
      # only invites someone to debug why it does not work. The mod speaks SslStream over TCP and
      # has no HTTP/3 at all; a browser falls back silently.
      - "80:80"
      - "443:443"
    environment:
      # `:-` and NOT `:?`, and this is load-bearing: compose interpolates EVERY service's variables
      # before it filters by profile, so a required-marker here fails `docker compose up` for the
      # whole stack - including the default, caddy-less path P7 actually boots with. Caught by
      # `docker compose config --services` on the default profile, which errored on a service that
      # was never going to start. The requirement is enforced where it can be without breaking
      # unrelated boots: an empty name is not a site address, so Caddy refuses to start (Caddyfile).
      LUMBERJACKS_PUBLIC_DNS_NAME: "${LUMBERJACKS_PUBLIC_DNS_NAME:-}"
      LUMBERJACKS_ACME_EMAIL: "${LUMBERJACKS_ACME_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # /data holds the issued certificates AND the ACME account key. It MUST be persistent: the
      # promotion drill rebuilds this stack routinely, and a fresh /data re-issues every time until
      # Let's Encrypt's duplicate-certificate limit (5/week for the same name set) locks the endpoint
      # out of TLS for days. This mount is the difference between a drill and an outage.
      - /mnt/comfy-p7/caddy/data:/data
      - /mnt/comfy-p7/caddy/config:/config
    depends_on:
      gateway:
        condition: service_started

  eventlog:
    <<: *lumberjacks-service
    # Pinned like gateway (m5 cutover): build+hash+pin, no admission check - eventlog has no
    # cross-artifact identity to admit, unlike gateway/mod. There is deliberately no build:
    # fallback; rollback is an image re-pin, never a rebuild. See docker-compose.yml history for
    # the release-gate defect this closes: this used to be one of three services that built from
    # whatever source happened to sit on the VM, with no release identity, no gate, no hash.
    image: "${LUMBERJACKS_EVENTLOG_IMAGE:?LUMBERJACKS_EVENTLOG_IMAGE must be set to the promoted release image}"
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      <<: *lumberjacks-telemetry
      OTEL_SERVICE_NAME: lumberjacks-eventlog
      Urls: "http://+:4002"
      ConnectionStrings__GameDb: "Host=postgres;Database=game;Username=game;Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  progression:
    <<: *lumberjacks-service
    # Pinned like gateway/eventlog (m5 cutover): build+hash+pin, no admission check.
    image: "${LUMBERJACKS_PROGRESSION_IMAGE:?LUMBERJACKS_PROGRESSION_IMAGE must be set to the promoted release image}"
    ports:
      - "127.0.0.1:4003:4003"
    environment:
      <<: *lumberjacks-telemetry
      OTEL_SERVICE_NAME: lumberjacks-progression
      Urls: "http://+:4003"
      ConnectionStrings__GameDb: "Host=postgres;Database=game;Username=game;Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  operatorapi:
    <<: *lumberjacks-service
    # Pinned like gateway/eventlog/progression (m5 cutover): build+hash+pin, no admission check.
    image: "${LUMBERJACKS_OPERATORAPI_IMAGE:?LUMBERJACKS_OPERATORAPI_IMAGE must be set to the promoted release image}"
    ports:
      - "127.0.0.1:4004:4004"
    environment:
      <<: *lumberjacks-telemetry
      OTEL_SERVICE_NAME: lumberjacks-operatorapi
      Urls: "http://+:4004"
      ConnectionStrings__GameDb: "Host=postgres;Database=game;Username=game;Password=${POSTGRES_PASSWORD}"
      ServiceUrls__Gateway: "http://gateway:4000"
      ServiceUrls__EventLog: "http://eventlog:4002"
      ServiceUrls__Progression: "http://progression:4003"
    depends_on:
      postgres:
        condition: service_healthy

  valheim-server:
    image: ghcr.io/community-valheim-tools/valheim-server@sha256:e8b13da3c44f54a38511c8ac224f2959a437c0b2626cf916683ca7acc8dfb146
    restart: unless-stopped
    cap_add:
      - sys_nice
    stop_grace_period: 2m
    ports:
      - "2456-2457:2456-2457/udp"
    environment:
      TZ: America/Los_Angeles
      SERVER_NAME: "Comfy Era16 Lab"
      WORLD_NAME: "ComfyEra16"
      SERVER_PASS: "${VALHEIM_SERVER_PASSWORD:-}"
      SERVER_PUBLIC: "false"
      SERVER_PORT: "2456"
      CROSSPLAY: "false"
      BEPINEX: "true"
      # World backups are a PRODUCTION data-safety feature, parameterized so dev
      # and prod pick their posture from the environment file. Dev default is OFF:
      # the world is an external import (already backed up elsewhere), so hourly
      # 580 MB zips of an idle 1.3 GB world only balloon the disk and the daily GCP
      # snapshot chain for nothing. Prod sets VALHEIM_BACKUPS=true with a sane
      # interval/retention (see environment.example). IF_IDLE=false so an unattended
      # world is never re-zipped when nothing changed. Knobs verified against the
      # community-valheim-tools/valheim-server image.
      BACKUPS: "${VALHEIM_BACKUPS:-false}"
      BACKUPS_INTERVAL: "${VALHEIM_BACKUPS_INTERVAL:-43200}"
      BACKUPS_IF_IDLE: "${VALHEIM_BACKUPS_IF_IDLE:-false}"
      BACKUPS_MAX_AGE: "${VALHEIM_BACKUPS_MAX_AGE:-2}"
      BACKUPS_MAX_COUNT: "${VALHEIM_BACKUPS_MAX_COUNT:-6}"
      UPDATE_IF_IDLE: "true"
      RESTART_IF_IDLE: "false"
      PUID: "1000"
      PGID: "1000"
      COMFY_LUMBERJACKS_CUTOVER_MODE: "${COMFY_LUMBERJACKS_CUTOVER_MODE:-native}"
      COMFY_LUMBERJACKS_ENROLLMENT_MANIFEST_ID: "${COMFY_LUMBERJACKS_ENROLLMENT_MANIFEST_ID:-}"
    volumes:
      - /mnt/comfy-p7/valheim/config:/config
      - /mnt/comfy-p7/valheim/data:/opt/valheim
    depends_on:
      gateway:
        condition: service_started
