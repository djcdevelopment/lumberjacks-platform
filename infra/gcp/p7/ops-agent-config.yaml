# Burn-stop hygiene 2026-07-23: docker-stdout and default syslog ingestion into
# Cloud Logging are disabled (they were 136K + 25K entries/3d of free-tier noise;
# see commandcenter GCP-AGENT-ASSESSMENT.html). Container logs remain on-VM via
# `docker logs` and the comfy-gateway MCP tail tools. To re-enable, restore the
# docker receiver/processor pipeline recorded in git history for this file.
logging:
  service:
    pipelines:
      default_pipeline:
        receivers: []

combined:
  receivers:
    otlp:
      type: otlp
      grpc_endpoint: 0.0.0.0:4317
      metrics_mode: googlecloudmonitoring

metrics:
  receivers:
    hostmetrics:
      type: hostmetrics
      collection_interval: 30s
  service:
    pipelines:
      otlp:
        receivers: [otlp]

traces:
  service:
    pipelines:
      otlp:
        receivers: [otlp]
